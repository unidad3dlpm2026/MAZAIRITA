<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vista previa - Mazairita</title>

    <!-- Visor de modelos 3D -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #222;
        }
    </style>
</head>

<body>

    <model-viewer
        src="MAZAIRITASALUDO.glb"
        alt="Modelo 3D de Mazairita"

        camera-controls
        autoplay
        auto-rotate

        shadow-intensity="1"
        exposure="1"

        camera-orbit="0deg 75deg 2.5m">

    </model-viewer>

</body>
</html>
